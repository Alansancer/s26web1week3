<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Week 3 - Semantics and Lists</title>
</head>
<body>
    <header>
        <h1>HTML Week 3 - Semantics and Lists</h1>
        <h3> PLus an intro to CSS</h3>
    </header>
    <nav>
        <!-- the nav tag reserves a space for navigation. you can have multiple links to different websites-->
         <a href="https://www.alansancer.com/">Get to know me and my work</a>
    </nav>

    <main>
        <!-- article is a self-contained block of text -->
        <article>
            <!-- Articles most have a a header (h1-h6)-->
            <h2> This is the title of a very important article</h2>            
            <!-- It also have paragraphs (p)-->
             <p> This is the text of a very important article</p>
        </article>
        <!-- The aside tag is used to separate the content that is not necessary to understand the page-->
        <aside>
            <h3> A side has to have a heading</h3>
            <p> It also should containt its beautiful paragraph</p>
        </aside>
    </main>
    <footer>
        <p>scary stuff &copy; scary people</p>
    </footer>
</body>
</html>
